[project]
name = "header-auth"
version = "1.0.0"
description = "Production-ready FastAPI service with header-based API key authentication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlmodel>=0.0.39",
    "pydantic-settings>=2.5.2",
    "pydantic[email]>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]